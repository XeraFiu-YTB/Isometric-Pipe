<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PipeForge Designer</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app-container">
        <div id="left-pane">
            <canvas id="canvas-2d"></canvas>
        </div>
        <div id="right-pane">
            <div id="view-3d"></div>
            <div id="project-settings">
                <h2>Project Settings</h2>
                <form>
                    <label for="project-name">Project Name:</label>
                    <input type="text" id="project-name" name="project-name">

                    <label for="spool-id">Spool ID:</label>
                    <input type="text" id="spool-id" name="spool-id">

                    <label for="material">Material:</label>
                    <input type="text" id="material" name="material">

                    <label for="schedule">Schedule:</label>
                    <input type="text" id="schedule" name="schedule">

                    <label for="pipe-size">Pipe Size:</label>
                    <input type="text" id="pipe-size" name="pipe-size">

                    <label for="units">Units:</label>
                    <select id="units" name="units">
                        <option value="metric">Metric (mm)</option>
                        <option value="imperial">Imperial (in/ft)</option>
                    </select>
                </form>
            </div>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
